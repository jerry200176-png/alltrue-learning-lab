<body>
  <main id="stage" aria-label="三维透镜实验台；按住器材任意部位可直接拖动，拖空白处旋转视角；滚轮缩放、双击器材打开精调面板、右键平移" title="按住器材直接拖动 · 拖空白旋转视角 · 双击器材精调"></main>

      <button class="chapter" data-section="apps">生活应用</button>

      <button id="menuButton" class="tool-button" aria-expanded="false" aria-controls="toolMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#122d3c"/><circle cx="16" cy="12" r="2" fill="#122d3c"/><circle cx="7" cy="18" r="2" fill="#122d3c"/></svg>课堂工具</button>

<button id="taskExplanationToggle" type="button" aria-expanded="false" aria-controls="taskHint explainLegend">操作与原理</button>
