name: Targeted nuclear lab verification
on:
  push:
    branches: [diag/nuclear-ready]
permissions:
  contents: read
jobs:
  nuclear:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: Verify actual WebKit controls and science
        env:
          LAB_URL: http://127.0.0.1:4173/
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_HEADED: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$LAB_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail "$LAB_URL" > /dev/null
          LAB_ENGINE=webkit xvfb-run -a node scripts/xiaobai-nuclear-check.mjs
