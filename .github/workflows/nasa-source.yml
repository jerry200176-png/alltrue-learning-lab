name: Inspect NASA public-domain texture
on:
  push:
    branches: [diag/nasa-texture]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read official source and image metadata
        run: |
          curl -L --fail --silent --show-error --max-time 30 'https://visibleearth.nasa.gov/images/73909/july-blue-marble-next-generation-w-topography-and-bathymetry' -o /tmp/nasa.html
          python3 -c 'import re; s=open("/tmp/nasa.html").read(); print("TITLE",re.findall(r"<title>(.*?)</title>",s,re.S|re.I)); print("JPEG LINKS",*sorted(set(re.findall(r"https://eoimages[^\x22\x27 ]+?\.jpg",s))),sep="\n")'
          curl -L --fail --silent --show-error --max-time 45 -D /tmp/headers 'https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73909/world.topo.bathy.200407.3x5400x2700.jpg' -o /tmp/nasa.jpg
          cat /tmp/headers
          file /tmp/nasa.jpg
          ls -lh /tmp/nasa.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: nasa-blue-marble-reference
          path: /tmp/nasa.jpg
          retention-days: 1
