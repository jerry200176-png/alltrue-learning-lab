name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:release
      - name: Browser and science checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          LAB_URL: http://127.0.0.1:4173/
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/alltrue-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$LAB_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail "$LAB_URL" > /dev/null
          node scripts/browser-check.mjs
          node scripts/science-check.mjs
      - name: Upload tested site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: WebKit mobile browser checks
        env:
          LAB_URL: http://127.0.0.1:4173/
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Keep the full mobile navigation check while using a virtual display.
          WEBKIT_HEADED: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/alltrue-webkit-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$LAB_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail "$LAB_URL" > /dev/null
          if ! xvfb-run -a node scripts/webkit-mobile-check.mjs; then
            echo "WebKit runner diagnostics:"
            free -h
            ps -eo pid,ppid,rss,stat,comm --sort=-rss | head -40
            exit 1
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, webkit]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v4
