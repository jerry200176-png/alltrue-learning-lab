name: Inspect authorised public lesson catalogue
on:
  push:
    branches: [diag/xiaobai-catalog]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --ignore-scripts --no-save rea-agents@6.8.0
      - name: Inspect authorised public lesson with REA
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {execFile} from 'node:child_process';
          import {promisify} from 'node:util';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const run=promisify(execFile);
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--remote-debugging-port=9222']});
          try {
            const page=await browser.newPage();
            await page.goto('https://xbjiaoyu.com/#catalog',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('main article h3').first().waitFor({timeout:45000});
            mkdirSync('/tmp/xiaobai-preview', {recursive:true});
            for (const id of ['mirror','lens','nuclear-energy','terrain','blocks','chemistry-chem02','chemistry-c07']) {
              await page.goto('https://xbjiaoyu.com/#course/'+id, {waitUntil:'domcontentloaded'});
              const responsePromise=page.waitForResponse(response=>new URL(response.url()).pathname==='/courseware/'+id,{timeout:60000});
              await page.getByRole('button',{name:'免费在线使用 ↗'}).click();
              const response=await responsePromise;
              if (!response.ok()) throw new Error('Public lesson failed: '+id+' HTTP '+response.status());
              const body=await response.body();
              if (body.length<1000) throw new Error('Public lesson unexpectedly small: '+id);
              writeFileSync('/tmp/xiaobai-preview/'+id+'.html',body);
              console.log('PUBLIC_LESSON',id,'bytes',body.length,'content-type',response.headers()['content-type']);
            }
            const targets=await (await fetch('http://127.0.0.1:9222/json/list')).json();
            const target=targets.find(t=>t.type==='page');
            const result=await run('./node_modules/.bin/rea',['inspect-web-page','http://127.0.0.1:9222',target.id,'--observation-ms','1000','--json'],{maxBuffer:20*1024*1024});
            const evidence=JSON.parse(result.stdout);
            console.log('REA_EVIDENCE',JSON.stringify({id:evidence.evidence_id,operation:evidence.operation,limitations:evidence.limitations}));

          } finally {await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: authorised-public-previews
          path: /tmp/xiaobai-preview/*.html
          retention-days: 1
