name: Inspect authorised public lesson catalogue
on:
  push:
    branches: [diag/xiaobai-catalog]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read public catalogue cards and links
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          try {
            const page=await browser.newPage();
            await page.goto('https://xbjiaoyu.com/#catalog',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('main article h3').first().waitFor({timeout:45000});
            page.on('response', response=>{if(response.url().startsWith('https://xbjiaoyu.com/') && !/\.(?:png|jpg|jpeg|webp|svg|css|woff2?)(?:\?|$)/i.test(response.url())) console.log('RESPONSE',response.status(),response.url(),response.headers()['content-type']);});
            await page.goto('https://xbjiaoyu.com/#course/mirror', {waitUntil:'domcontentloaded'});
            await page.getByRole('button',{name:'免费在线使用 ↗'}).click();
            await page.waitForTimeout(8000);
            console.log('AFTER_TRIAL',page.url(),(await page.locator('body').innerText()).slice(0,8000));
            console.log('FRAMES',JSON.stringify(page.frames().map(f=>({url:f.url(),name:f.name()}))));
            await page.goto('https://xbjiaoyu.com/#course/mirror', {waitUntil:'domcontentloaded'});
            await page.getByRole('button',{name:'↓ 下载课件'}).click();
            await page.waitForTimeout(2000);
            console.log('AFTER_DOWNLOAD',(await page.locator('body').innerText()).slice(-4000));

          } finally {await browser.close()}
          JS
