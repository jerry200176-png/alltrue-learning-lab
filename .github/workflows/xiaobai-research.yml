name: Inspect authorised public lesson catalogue
on:
  push:
    branches: [diag/xiaobai-catalog]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read public catalogue cards and links
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          try {
            const page=await browser.newPage();
            await page.goto('https://xbjiaoyu.com/#catalog',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('main article h3').first().waitFor({timeout:45000});
            for (const id of ['mirror','lens','terrain','chemistry-c07']) {
              await page.goto('https://xbjiaoyu.com/#course/' + id, {waitUntil:'domcontentloaded'});
              await page.waitForTimeout(3000);
              console.log('COURSE', id, 'URL', page.url(), 'TEXT', (await page.locator('main').innerText()).slice(0,5000));
              console.log('CONTROLS', JSON.stringify(await page.locator('main a,main button').evaluateAll(es=>es.map(e=>({tag:e.tagName,text:e.innerText,href:e.href,action:e.getAttribute('data-action')})))));
            }

          } finally {await browser.close()}
          JS
