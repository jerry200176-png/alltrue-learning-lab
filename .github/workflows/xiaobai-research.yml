name: Inspect authorised public lesson catalogue
on:
  push:
    branches: [diag/xiaobai-catalog]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read public catalogue cards and links
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          try {
            const page=await browser.newPage();
            await page.goto('https://xbjiaoyu.com/#catalog',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('main article h3').first().waitFor({timeout:45000});
            page.on('response', async response=>{if(response.url().includes('/api/launch/') || response.url().includes('/api/access/')) {const data=await response.json().catch(()=>null); console.log('API_META',new URL(response.url()).pathname,response.status(),data?Object.keys(data):'non-json');}});
            await page.goto('https://xbjiaoyu.com/#course/mirror', {waitUntil:'domcontentloaded'});
            await page.getByRole('button',{name:'免费在线使用 ↗'}).click();
            await page.waitForTimeout(45000);
            console.log('PUBLIC_PLAY', page.url());
            console.log('CLASSROOM', (await page.locator('#classroom').innerText()).slice(0,3000));
            console.log('FRAMES', JSON.stringify(page.frames().map(f=>({url:f.url().split('?')[0],name:f.name()}))));
            console.log('IFRAMES', JSON.stringify(await page.locator('iframe').evaluateAll(es=>es.map(e=>({src:e.getAttribute('src')?.split('?')[0],hasSrcdoc:e.hasAttribute('srcdoc')})))));

          } finally {await browser.close()}
          JS
